name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-flight runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: friends-mobile

jobs:
  # TypeScript + Lint run in parallel — fast feedback, no test overhead
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: friends-mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: friends-mobile/package-lock.json
      - run: npm ci
      - run: npm run lint

  # Critical unit tests only — AI service, settings store, DB queries
  # Skips component/snapshot tests which require native modules and slow CI down
  test:
    name: Critical Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: friends-mobile/package-lock.json
      - run: npm ci
      - name: Run critical tests
        run: |
          npx jest --ci --forceExit --maxWorkers=2 \
            --testPathPatterns='lib/ai|store|lib/db'
        env:
          CI: true
